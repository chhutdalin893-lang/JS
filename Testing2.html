<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Click me</h2>
    <button type="button" onclick="calculator()">Click Here</button>
</body>
<script>
    function calculator(){
        var x,y;
        x = parseInt(prompt("Enter value x = "))
        y = parseInt(prompt("Enter value y = "))
        alert("Value x + y =" + (x+y))
    }
</script>
</html>
