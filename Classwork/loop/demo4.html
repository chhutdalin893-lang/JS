<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let N = parseInt(prompt("N : "))
        document.write("N = " + N + "<br>")
        let result = 1;
        

        for(let i = 1 ; i <= N ; i++){
            document.writeln (i + " / ")
            result /= i
        }
        document.write(" = " + result);
    </script>  
</body>
</html>
