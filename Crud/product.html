<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Product</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>
  </head>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container-fluid {
      width: 100%;
      min-height: 100vh;
      padding-top: 40px;
      padding-bottom: 40px;
    }
    .container-form {
      width: 100%;
      max-width: 550px;
      padding: 40px;
      background-color: rgb(255, 255, 255);
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      margin: 0 auto 40px auto;
    }
  </style>
  <body>
    <div class="container-fluid">
      <div class="container-form">
        <div>
          <h1 class="text-center h3 mb-4">Form Information Product</h1>
        </div>
        <form id="formInput" onsubmit="submitData(event)">
          <div class="my-3 form-group">
            <input
              type="text"
              class="form-control"
              id="inputname"
              placeholder="Enter Name Product"
              required
            />
          </div>
          <div class="my-3 form-group">
            <input
              type="number"
              class="form-control"
              id="inputprice"
              placeholder="Enter Price"
              required
            />
          </div>
          <div class="my-3 form-group">
            <input
              type="number"
              class="form-control"
              id="inputqty"
              placeholder="Enter Qty"
              required
            />
          </div>
          <div class="my-3 form-group">
            <input
              type="number"
              class="form-control"
              id="inputUnit_price"
              placeholder="Enter Unit Price"
              required
            />
          </div>
          <div class="my-3 form-group">
            <input
              type="number"
              class="form-control"
              id="inputstock"
              placeholder="Enter Stock"
              required
            />
          </div>
          <div>
            <button
              type="submit"
              id="submit"
              class="btn btn-info rounded w-100 text-light fw-bold fs-6"
            >
              Save
            </button>
          </div>
        </form>
      </div>

      <div class="container">
        <table class="table table-bordered table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>NAME</th>
              <th>PRICE</th>
              <th>QTY</th>
              <th>UNIT PRICE</th>
              <th>STOCK</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="tbody">
          </tbody>
        </table>
      </div>
    </div>
  </body>

  <script>
    let StockProduct = [];
    let editIndex = null; // Keeps track of which row is being edited

    let formInput = document.getElementById("formInput");
    let inputname = document.getElementById("inputname");
    let inputprice = document.getElementById("inputprice");
    let inputqty = document.getElementById("inputqty");
    let inputUnit_price = document.getElementById("inputUnit_price");
    let inputstock = document.getElementById("inputstock");
    let submit = document.getElementById("submit");
    let tbody = document.getElementById('tbody');

    function submitData(event) {
      event.preventDefault();

      const data = {
        name: inputname.value.trim(),
        price: inputprice.value.trim(),
        qty: inputqty.value.trim(),
        unitPrice: inputUnit_price.value.trim(),
        stock: inputstock.value.trim(),
      };

      if (editIndex !== null) {
        // Update existing product
        StockProduct[editIndex] = data;
        editIndex = null; // Clear edit status
        submit.innerText = "Save"; // Reset button text
      } else {
        // Create new product
        StockProduct.push(data);
      }

      loadData(); 
      formInput.reset();
    }

    function loadData() {
      tbody.innerHTML = "";
      StockProduct.forEach((value, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${value.name}</td>
            <td>$${value.price}</td>
            <td>${value.qty}</td>
            <td>$${value.unitPrice}</td>
            <td>${value.stock}</td>
            <td>
              <button class="btn btn-sm btn-warning" onclick="editData(${index})">EDIT</button>
              <button class="btn btn-sm btn-danger" onclick="deletData(${index})">DELETE</button>
              <button class="btn btn-sm btn-primary" onclick="viewData(${index})">VIEW</button>
            </td>
          </tr>
        `;
      });
    }

    function deletData(index) {
      if (confirm("Are you sure you want to delete this product?")) {
        StockProduct.splice(index, 1);
        if (editIndex === index) {
          editIndex = null;
          submit.innerText = "Save";
          formInput.reset();
        }
        loadData();
      }
    }

    function editData(index) {
      editIndex = index;
      let product = StockProduct[index];
      
      inputname.value = product.name;
      inputprice.value = product.price;
      inputqty.value = product.qty;
      inputUnit_price.value = product.unitPrice;
      inputstock.value = product.stock;
      
      submit.innerText = "Update";
      
    }

    


















    function viewData(index) {
      let product = StockProduct[index];
      alert(`Product Details:\n\nName: ${product.name}\nPrice: $${product.price}\nQty: ${product.qty}\nUnit Price: $${product.unitPrice}\nStock: ${product.stock}`);
    }
  </script>
</html>
